[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "law-monitor-mvp"
version = "0.1.0"
description = "MVP системы мониторинга нормативно-правовых актов, господдержки и новостей в сфере АПК."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler",
  "beautifulsoup4",
  "pydantic",
  "pymupdf",
  "python-docx",
  "python-dotenv",
  "pyyaml",
  "requests[socks]",
  "tqdm",
]

[tool.setuptools.packages.find]
include = ["app*"]
